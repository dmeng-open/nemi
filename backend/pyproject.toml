[project]
name = "nemi"
version = "0.1.0"
description = "Nemi local planning agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "icalendar>=6.1",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "openai>=1.68",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evals"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/integrations/**/catalog.py" = ["E501"]
"app/agents/prompts/**" = ["E501"]
"app/agents/v3/**/*.py" = ["E501"]
"app/core/messages.py" = ["E501"]
"evals/**/*.py" = ["E501"]
"app/api/**" = ["B008"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
