services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nemi
    ports:
      - "5432:5432"
    volumes:
      - nemi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nemi"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nemi_pg:
